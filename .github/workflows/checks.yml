# The checks of one Ubuntu release: its OpenCV and PCL, and the ROS 2
# distribution that goes with it. Not triggered on its own: ubuntu-24.04.yml and
# ubuntu-26.04.yml call it, one workflow (and one badge) per release.
#
# Everything runs in the images of tools/ci/, the same ones
# tools/ci/run_local.sh uses, so a failure here can be reproduced locally.
#
# Two depths. A push or a pull request gets the quick checks: the build with no
# warnings, check_repo.py, --help, and colcon build and test. The weekly run
# and a manual run also build each example on its own, run every example, check
# .gitignore and feed the ROS 2 nodes: minutes instead of seconds, and GUI
# runs that are better not in the way of every push.

name: Checks

on:
  workflow_call:
    inputs:
      ubuntu:
        description: 'Ubuntu release: 24.04 or 26.04'
        type: string
        required: true
      ros_distro:
        description: 'ROS 2 distribution of that release: jazzy or lyrical'
        type: string
        required: true
      full:
        description: 'Run everything, not only the quick checks'
        type: boolean
        default: false

jobs:
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: tools/ci
          file: tools/ci/Dockerfile
          build-args: UBUNTU=${{ inputs.ubuntu }}
          tags: vision-ci:${{ inputs.ubuntu }}
          load: true
          cache-from: type=gha,scope=ubuntu-${{ inputs.ubuntu }}
          cache-to: type=gha,mode=max,scope=ubuntu-${{ inputs.ubuntu }}

      - name: Build, check and (full run) run the examples
        run: |
          docker run --rm --init \
            -v "$PWD":/src:ro \
            -v "$GITHUB_STEP_SUMMARY":/summary.md -e GITHUB_STEP_SUMMARY=/summary.md \
            vision-ci:${{ inputs.ubuntu }} \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 /src/tools/ci/run_examples.py --src /src --work /work \
              --require-models --title "Ubuntu ${{ inputs.ubuntu }}" \
              --steps ${{ inputs.full && 'build,check,standalone,help,run,clean' || 'build,check,help' }}

  ros2:
    name: ROS 2 ${{ inputs.ros_distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: tools/ci
          file: tools/ci/Dockerfile.ros2
          build-args: ROS_DISTRO=${{ inputs.ros_distro }}
          tags: vision-ci:${{ inputs.ros_distro }}
          load: true
          cache-from: type=gha,scope=ros2-${{ inputs.ros_distro }}
          cache-to: type=gha,mode=max,scope=ros2-${{ inputs.ros_distro }}

      - name: rosdep, colcon build, colcon test and (full run) smoke test
        run: |
          docker run --rm --init \
            -v "$PWD":/src:ro \
            -v "$GITHUB_STEP_SUMMARY":/summary.md -e GITHUB_STEP_SUMMARY=/summary.md \
            vision-ci:${{ inputs.ros_distro }} \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 /src/tools/ci/ros2_check.py --src /src --work /work \
              --title "ROS 2 ${{ inputs.ros_distro }}" \
              --steps ${{ inputs.full && 'deps,build,test,smoke' || 'deps,build,test' }}
